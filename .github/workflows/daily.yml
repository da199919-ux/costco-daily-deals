name: 每日更新 Costco 優惠

on:
  schedule:
    # 每小時避開整點喚醒一次，再由下方檢查是否已超過 4 小時。
    # 若未滿 4 小時會立即結束，不會重複抓取 Costco。
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - "watchlist.txt"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  issues: write

# 同一時間只允許一個 Costco 更新程序執行，避免兩次執行互相搶著上傳。
concurrency:
  group: costco-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: 下載專案
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 檢查是否需要更新
        id: frequency
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "手動執行或程式更新，立即產生清單"
            exit 0
          fi

          last_update=$(git log -1 \
            --format=%ct \
            --grep='^自動更新 Costco 每日優惠$' || true)
          now=$(date +%s)

          if [ -z "$last_update" ] || [ $((now - last_update)) -ge 13500 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "距離上次更新已達約 4 小時，開始更新"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "距離上次更新未滿約 4 小時，本次略過"
          fi

      - name: 設定 Python
        if: steps.frequency.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        if: steps.frequency.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: 安裝網頁瀏覽器
        if: steps.frequency.outputs.should_run == 'true'
        run: playwright install --with-deps chromium

      - name: 產生今日清單
        if: steps.frequency.outputs.should_run == 'true'
        run: python -m src.main

      - name: 更新公開網頁
        if: steps.frequency.outputs.should_run == 'true'
        run: node scripts/build_pages.mjs

      - name: 儲存更新結果
        if: steps.frequency.outputs.should_run == 'true'
        run: |
          if [ -z "$(git status --porcelain -- output/ docs/)" ]; then
            echo "今天的清單沒有變更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          git commit -m "自動更新 Costco 每日優惠"
          # 若執行期間遠端剛好有新版本，先同步後再重試，避免 fetch first。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "遠端有較新更新，第 ${attempt} 次重新同步"
            git fetch origin main
            git rebase origin/main
          done
          echo "連續三次仍無法上傳更新"
          exit 1

      - name: 發布 Gmail 摘要通知
        if: steps.frequency.outputs.should_run == 'true'
        # 通知失敗時不要讓整次更新變成失敗，網站仍會照常發布。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary_date=$(TZ=Asia/Taipei date +%F)
          title="Costco 每日優惠摘要 ${summary_date}"

          # GitHub issue 內文上限 65536 字元；過長時截斷並附上完整摘要連結。
          python - <<'PY'
          import os
          text = open("output/summary.md", encoding="utf-8").read()
          limit = 60000
          if len(text) > limit:
              url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/blob/main/output/summary.md"
              text = text[:limit].rsplit("\n", 1)[0] + f"\n\n---\n內容過長已截斷，完整摘要：{url}\n"
          open("summary_body.md", "w", encoding="utf-8").write(text)
          PY

          # 只採用標題完全相同的 issue，避免模糊搜尋把摘要留言到別天的 issue。
          issue_number=$(gh issue list \
            --state all \
            --search "${title} in:title" \
            --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // empty")

          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --body-file summary_body.md
          else
            gh issue create \
              --title "${title}" \
              --body-file summary_body.md \
              --assignee "${GITHUB_REPOSITORY_OWNER}"
          fi
