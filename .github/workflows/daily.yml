name: 每日更新 Costco 優惠

on:
  schedule:
    # GitHub 排程使用 UTC；23:00 UTC 是台灣隔天 07:00。
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案
        uses: actions/checkout@v6

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 產生今日清單
        run: python -m src.main

      - name: 儲存更新結果
        run: |
          if git diff --quiet -- output/; then
            echo "今天的清單沒有變更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest.md output/latest.csv
          git commit -m "自動更新 Costco 每日優惠"
          git push
