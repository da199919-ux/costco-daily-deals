name: 每日更新 Costco 優惠

on:
  schedule:
    # GitHub 排程使用 UTC；避開整點尖峰，每 4 小時的第 17 分鐘執行。
    # 對應台灣時間約為 00:17、04:17、08:17、12:17、16:17、20:17。
    - cron: "17 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "requirements.txt"
      - "watchlist.txt"
      - ".github/workflows/daily.yml"

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案
        uses: actions/checkout@v6

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 安裝網頁瀏覽器
        run: playwright install --with-deps chromium

      - name: 產生今日清單
        run: python -m src.main

      - name: 更新公開網頁
        run: node scripts/build_pages.mjs

      - name: 儲存更新結果
        run: |
          if [ -z "$(git status --porcelain -- output/ docs/)" ]; then
            echo "今天的清單沒有變更"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ docs/
          git commit -m "自動更新 Costco 每日優惠"
          git push

      - name: 發布 Gmail 摘要通知
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary_date=$(TZ=Asia/Taipei date +%F)
          title="Costco 每日優惠摘要 ${summary_date}"
          issue_number=$(gh issue list \
            --state all \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --body-file output/summary.md
          else
            gh issue create \
              --title "${title}" \
              --body-file output/summary.md \
              --assignee "${GITHUB_REPOSITORY_OWNER}"
          fi
